schema_version: barcarolle.phase1_statement_hardened_holdout_preregistration.v1
release_type: statement_hardened_two_repo_holdout_preregistration
created_at: 2026-05-25T02:04:56Z

policy:
  paid_acut_calls_enabled: false
  paid_llm_calls_enabled: false
  historical_paid_score_tables_immutable: true
  future_paid_validation_requires_user_approval: true
  endpoint_base_url_env: LLM_BASE_URL
  endpoint_api_key_env: LLM_API_KEY

source_artifacts:
  proposal: <local-downloads>/barcarolle-research-0519.md
  attrs_h_future_evidence_status: experiments/phase1_compiler/results/phase1_attrs_h_future_evidence_status.json
  attrs_h_future_task_design_audit: experiments/phase1_compiler/results/phase1_attrs_h_future_task_design_audit.json
  attrs_h_future_statement_sensitivity: experiments/phase1_compiler/results/phase1_attrs_h_future_statement_sensitivity.json
  attrs_h_future_statement_preview: experiments/phase1_compiler/results/phase1_attrs_h_future_statement_preview.json
  task_outcome_matrix: experiments/phase1_compiler/results/phase1_two_repo_task_outcome_matrix.json
  statement_quality_tool: experiments/phase0_headroom/tools/statement_quality.py
  boltons_certified_tasks: experiments/phase0_headroom/certified_tasks/boltons_clean_outcome_unseen_supply_certified_tasks.jsonl
  attrs_certified_tasks: experiments/phase0_headroom/certified_tasks/attrs_clean_outcome_unseen_supply_certified_tasks.jsonl
  boltons_source_context: experiments/phase0_headroom/candidate_sources/boltons_clean_outcome_unseen_supply_source_context.jsonl
  attrs_source_context: experiments/phase0_headroom/candidate_sources/attrs_clean_outcome_unseen_supply_source_context.jsonl

selection:
  minimum_repo_count: 2
  preferred_repos:
    - boltons
    - attrs
  preferred_splits:
    - B_eval
    - H_future
  tasks_per_repo_split: 4
  fallback_release: attrs_only_statement_hardened_diagnostic_release
  planned_adapters:
    - codex_workspace
    - kilo_workspace
  required_statement_quality_gate: pass
  allow_manual_review_with_explicit_rationale: true
  exclude_paid_outcome_from_selection: true
  implementation_scope_only: true

output_paths:
  preflight: experiments/phase1_compiler/results/phase1_statement_hardened_holdout_preflight.json
  candidate_inventory: experiments/phase1_compiler/results/phase1_statement_hardened_candidate_inventory.json
