  release_preview: experiments/phase1_compiler/results/phase1_statement_hardened_release_preview.json
  release_manifest: experiments/phase1_compiler/results/phase1_statement_hardened_release_manifest.json
  preregistration: experiments/phase1_compiler/results/phase1_statement_hardened_preregistration.json
  validation_decision: experiments/phase1_compiler/results/phase1_statement_hardened_validation_decision.json
  blocker: experiments/phase1_compiler/results/phase1_statement_hardened_blocker.json
  process_report: experiments/phase1_compiler/reports/phase1_statement_hardened_holdout_process.md
  candidate_inventory_report: experiments/phase1_compiler/reports/phase1_statement_hardened_candidate_inventory.md
  candidate_screen_report: experiments/phase1_compiler/reports/phase1_statement_hardened_candidate_screen.md
