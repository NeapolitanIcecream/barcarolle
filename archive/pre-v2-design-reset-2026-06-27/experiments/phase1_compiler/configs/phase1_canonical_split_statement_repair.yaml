schema_version: barcarolle.phase1_canonical_split_statement_repair.v1
runbook: docs/experiments/phase-1-targeted-statement-hardened-replacement-supply-runbook.md
created_at: 2026-05-25T07:28:37Z

policy:
  paid_acut_calls_enabled: false
  paid_solver_cells_enabled: false
  rerun_existing_scoreable_cells: false
  rerun_attrs_hist_027_policy_violation_cell: false
  rewrite_historical_score_tables: false
  historical_pass_fail_used_for_selection: false
  historical_score_artifacts_used_for_membership_and_split_only: true
  replacement_mining_deferred_until_canonical_split_repair_attempted: true
  codex_subscription_generation_review_conditionally_enabled: true
  generator_reviewer_llm_api_endpoint_enabled: false
  deterministic_generation_review_fallback_allowed: false
  raw_prompts_completions_logs_committed: false
  raw_target_diffs_committed: false
  endpoint_env_vars_unset_for_generator_reviewer:
    - LLM_BASE_URL
    - LLM_API_KEY
    - OPENAI_API_KEY
    - OPENROUTER_API_KEY
  required_codex_model: gpt-5.5
  required_reasoning_effort: xhigh

generation_review:
  execution_mode: external_codex_cli_generator_reviewer_loop_for_missing_canonical_tasks
  generator_tmux_session: phase1-canonstmt-generator
  reviewer_tmux_session: phase1-canonstmt-reviewer
  workflow_dir: .codex-workflows/phase1-canonical-split-statement-repair-codex-loop
  target_statement_length_chars_min: 1500
  target_statement_length_chars_max: 2500
  target_statement_length_chars_soft_max: 4000

source_artifacts:
  latest_codex_loop_process: experiments/phase1_compiler/reports/phase1_diff_assisted_codex_loop_process.md
  latest_codex_loop_session_proof: experiments/phase1_compiler/reports/phase1_diff_assisted_codex_loop_session_proof.md
  latest_codex_loop_statement_screen_report: experiments/phase1_compiler/reports/phase1_diff_assisted_codex_loop_statement_screen.md
  latest_codex_loop_statement_screen: experiments/phase1_compiler/results/phase1_diff_assisted_codex_loop_statement_screen.json
  latest_codex_loop_generated_statements: experiments/phase1_compiler/results/phase1_diff_assisted_codex_loop_generated_statements.jsonl
  latest_codex_loop_statement_reviews: experiments/phase1_compiler/results/phase1_diff_assisted_codex_loop_statement_reviews.json
  latest_codex_loop_deterministic_qa: experiments/phase1_compiler/results/phase1_diff_assisted_codex_loop_deterministic_qa.json
  latest_codex_loop_recovery_decision: experiments/phase1_compiler/reports/phase1_diff_assisted_codex_loop_recovery_decision.md
  old_future_holdout_entry_gate_report: experiments/phase1_compiler/reports/phase1_preregistered_clean_future_holdout_entry_gate.md
  old_future_holdout_entry_gate: experiments/phase1_compiler/results/phase1_preregistered_clean_future_holdout_entry_gate.json
  task_outcome_matrix_report: experiments/phase1_compiler/reports/phase1_two_repo_task_outcome_matrix.md
  task_outcome_matrix: experiments/phase1_compiler/results/phase1_two_repo_task_outcome_matrix.json
  current_statement_hardened_inventory: experiments/phase1_compiler/results/phase1_statement_hardened_candidate_inventory.json
  boltons_clean_certified_tasks: experiments/phase0_headroom/certified_tasks/boltons_clean_outcome_unseen_supply_certified_tasks.jsonl
  boltons_historical_certified_tasks: experiments/phase0_headroom/certified_tasks/boltons_certified_tasks.jsonl
  boltons_clean_source_context: experiments/phase0_headroom/candidate_sources/boltons_clean_outcome_unseen_supply_source_context.jsonl
  boltons_historical_source_context: experiments/phase0_headroom/candidate_sources/boltons_source_context.jsonl
  attrs_clean_certified_tasks: experiments/phase0_headroom/certified_tasks/attrs_clean_outcome_unseen_supply_certified_tasks.jsonl
  attrs_clean_source_context: experiments/phase0_headroom/candidate_sources/attrs_clean_outcome_unseen_supply_source_context.jsonl

external_repos:
  boltons: experiments/phase0_headroom/external_repos/boltons
  attrs: experiments/phase0_headroom/external_repos/attrs

selection:
  preferred_repos:
    - boltons
    - attrs
  preferred_splits:
    - B_eval
    - H_future
  tasks_per_repo_split: 4
  required_review_status: pass
  required_qa_status: pass
  canonical_split_source: frozen_preregistration_entry_gate_and_two_repo_matrix_membership
  exclude_paid_outcome_from_selection: true
  implementation_scope_only: true

output_paths:
  preflight: experiments/phase1_compiler/results/phase1_canonical_split_repair_preflight.json
  canonical_split_map: experiments/phase1_compiler/results/phase1_canonical_split_map.json
  canonical_selected_inventory: experiments/phase1_compiler/results/phase1_canonical_selected_inventory.json
  missing_statement_packets: experiments/phase1_compiler/results/phase1_canonical_missing_statement_packets.json
  session_proof: experiments/phase1_compiler/results/phase1_canonical_codex_loop_session_proof.json
  regenerated_statements: experiments/phase1_compiler/results/phase1_canonical_regenerated_statements.jsonl
  statement_reviews: experiments/phase1_compiler/results/phase1_canonical_statement_reviews.json
  statement_qa: experiments/phase1_compiler/results/phase1_canonical_statement_qa.json
  statement_screen: experiments/phase1_compiler/results/phase1_canonical_statement_screen.json
  split_repair_decision: experiments/phase1_compiler/results/phase1_canonical_split_repair_decision.json
  process_report: experiments/phase1_compiler/reports/phase1_canonical_split_repair_process.md
  selected_inventory_report: experiments/phase1_compiler/reports/phase1_canonical_selected_inventory.md
  statement_reviews_report: experiments/phase1_compiler/reports/phase1_canonical_statement_reviews.md
  statement_screen_report: experiments/phase1_compiler/reports/phase1_canonical_statement_screen.md
  split_repair_decision_report: experiments/phase1_compiler/reports/phase1_canonical_split_repair_decision.md
