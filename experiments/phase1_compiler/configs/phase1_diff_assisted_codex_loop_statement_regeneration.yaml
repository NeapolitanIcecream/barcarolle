  target_statement_length_chars:
    min: 1500
    max: 2500
    soft_max: 4000
  default_candidate_batch: all_current_boltons_attrs_statement_hardened_inventory
  soft_incremental_cost_cap_usd: 10
  hard_incremental_cost_cap_usd: 20

