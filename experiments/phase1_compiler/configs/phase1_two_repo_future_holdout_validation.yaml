schema_version: barcarolle.phase1_two_repo_future_holdout_validation.v1
status: configured
claim_scope: two_repo_future_holdout_design_not_predictive_validation
predictive_validity_established: false
paid_second_repo_acut_calls: enabled_after_entry_gate
paid_second_repo_llm_calls: enabled_after_entry_gate

repos:
  - boltons
  - attrs

existing_paid_evidence:
  boltons:
    decision: experiments/phase1_compiler/results/phase1_future_holdout_decision.json
    b_eval_prefix: phase1_future_holdout_b_eval
    h_future_prefix: phase1_future_holdout_h_future
    b_eval_scoreable_cells: 8
    h_future_scoreable_cells: 8

second_repo_clean_supply_overlay: experiments/phase1_compiler/results/phase1_second_repo_clean_supply_overlay.json
second_repo_clean_supply_certified_tasks: experiments/phase0_headroom/certified_tasks/attrs_clean_outcome_unseen_supply_certified_tasks.jsonl

second_repo_planned_paid_prefixes:
  b_eval: phase1_two_repo_future_holdout_attrs_b_eval
  h_future: phase1_two_repo_future_holdout_attrs_h_future

splits:
  b_eval:
    - attrs__hist__001
    - attrs__hist__003
    - attrs__hist__004
    - attrs__hist__008
  h_future:
    - attrs__hist__012
    - attrs__hist__013
    - attrs__hist__023
    - attrs__hist__027

adapters:
  config: experiments/phase0_headroom/configs/acut_workspace_adapters.yaml
  ids:
    - codex_workspace
    - kilo_workspace

acceptance:
  min_target_repos: 2
  min_holdout_scoreable_cells: 12
  policy_violations_max: 0
  non_scoreable_cells_max_per_split: 2

output_paths:
  clean_supply: experiments/phase1_compiler/results/phase1_two_repo_future_holdout_clean_supply.json
  preregistration: experiments/phase1_compiler/results/phase1_two_repo_future_holdout_preregistration.json
  preregistration_report: experiments/phase1_compiler/reports/phase1_two_repo_future_holdout_preregistration.md
  prediction_metrics: experiments/phase1_compiler/results/phase1_two_repo_future_holdout_prediction_metrics.json
  prediction_metrics_report: experiments/phase1_compiler/reports/phase1_two_repo_future_holdout_prediction_metrics.md
  decision: experiments/phase1_compiler/results/phase1_two_repo_future_holdout_decision.json
  decision_report: experiments/phase1_compiler/reports/phase1_two_repo_future_holdout_decision.md

guardrails:
  run_second_repo_paid_cells_now: true
  tune_on_holdout_tasks: false
  mix_outcome_seen_rows_into_clean_validation: false
