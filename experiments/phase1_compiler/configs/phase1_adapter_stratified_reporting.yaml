  pooled_result_allowed_when_marked_diagnostic: true
  completed_paid_pilot_claim_boundary: pilot_evidence_only
  completed_paid_pilot_decision_mutable: false
  predictive_validity_claim_allowed: false
  adapters_interchangeable_without_evidence: false
  token_estimated_cost_is_provider_billed_cost: false
