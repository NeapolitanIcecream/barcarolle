  - actual_provider_billed_cost_usd
  - cost_per_cell_usd
  - usage_observed_rate
  - median_latency_seconds
required_pairwise_metrics:
  - paired_task_count
  - both_pass
  - both_fail
  - adapter_a_only_pass
  - adapter_b_only_pass
  - disagreement_count
  - disagreement_rate
  - exact_count_summary
required_cost_latency_fields:
  - cost_basis
  - observed_token_estimated_cost_usd
  - conservative_token_estimated_cost_usd
  - actual_provider_billed_cost_usd
  - provider_billed_cost_status
  - cost_per_cell_usd
  - median_latency_seconds
future_paid_gates:
  - adapter_reporting_policy_loaded
  - adapter_level_result_table_required
  - paired_disagreement_table_required_for_shared_tasks
  - cost_estimate_or_bill_status_required
  - pooled_headline_primary_only_if_preregistered
  - pooled_headline_secondary_or_diagnostic_otherwise
  - single_acut_runs_must_name_scoreable_adapter_before_outcomes
