  catastrophic_miss_threshold: 0.15
  minimum_mae_margin_vs_best_simple_baseline: 0.01
  majority_of_slices_rule: candidate_improves_more_slices_than_it_worsens
baselines:
  - temporal_recent_baseline
  - repo_unweighted_same_budget
  - repo_stratified_by_target_profile
  - seeded_random_same_budget
