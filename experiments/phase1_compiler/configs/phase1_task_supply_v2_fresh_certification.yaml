  expected_raw_candidate_count: 829
  deduplicate_by_stable_key: true
  issue_only_without_changed_tests_status: oracle_missing_inventory_only
  changed_test_oracle_required_for_execution: true
  unattempted_cap_deferred_is_not_failure: true
  priority_order:
    - non_leaky_issue_or_pr_context
    - pr_title_only_context
    - commit_message_only_context
    - no_usable_public_context
    - material_ambiguity_risk
    - material_leakage_risk
environment_profile_policy:
  current_profile_first: true
  historical_profiles_bounded: true
  profiles_per_candidate: 5
  dependency_time_policy: exclude_newer_relative_to_task_time
  use_uv_managed_python: true
certification_caps:
  single_command_timeout_seconds: 120
  single_candidate_total_timeout_seconds: 600
  environment_profiles_per_candidate: 5
  runbook_level_timeout_seconds: 21600
first_wave_attempt_cap_by_repo:
  attrs: 160
  humanize: 92
  toolz: 160
  boltons: 80
stretch_goal:
  continue_until_all_oracle_usable_attempted_if_runtime_reasonable: true
  do_not_infer_no_supply_from_cap_deferred_candidates: true
source_context_policy:
  release_eligible_context_classes:
    - non_leaky_issue_or_pr_context
    - pr_title_only_context
  technical_certified_but_not_release_eligible_without_review:
    - commit_message_only_context
    - no_usable_public_context
    - material_ambiguity_risk
  leakage_classes_block_release:
    - material_leakage_risk
  endpoint_statement_review_performed_in_this_run: false
  commit_message_only_manual_review_queue: true
paid_readiness_policy:
  release_eligible_min_per_repo: 30
  repos_required_at_min: 3
  paid_acut_calls_made: false
  paid_llm_statement_generation_made: false
  raw_logs_workspaces_must_not_be_committed: true
  subgate_labels_required_for_failures: true
  no_unreviewed_material_leakage_risk: true
  source_reservoir_mix_policy_checked: true
